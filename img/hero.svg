<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Yehaw — Filipino daily life: jeepney, sari-sari store, fiesta banderitas and the Philippine sun">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset=".38" stop-color="#7a1f63"/>
      <stop offset=".68" stop-color="#e2445c"/>
      <stop offset=".88" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#ffcf4d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffcf4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="jeepbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5252"/>
      <stop offset="1" stop-color="#b3121f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
  </defs>

  <style>
    .rays { animation: spin 70s linear infinite; transform-origin: 600px 185px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .flags { animation: sway 2.8s ease-in-out infinite alternate; transform-origin: 600px 60px; }
    @keyframes sway { from { transform: skewX(-2.5deg); } to { transform: skewX(2.5deg); } }
    .flagph { animation: wave 2.2s ease-in-out infinite alternate; transform-origin: 402px 358px; }
    @keyframes wave { from { transform: skewY(-4deg); } to { transform: skewY(4deg); } }
    .clouds { animation: drift 26s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
  </style>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- drifting clouds -->
  <g class="clouds" fill="#ffffff" opacity=".16">
    <ellipse cx="240" cy="150" rx="110" ry="22"/>
    <ellipse cx="320" cy="130" rx="70" ry="16"/>
    <ellipse cx="960" cy="110" rx="130" ry="24"/>
    <ellipse cx="1050" cy="135" rx="80" ry="16"/>
  </g>

  <!-- birds -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity=".65" stroke-linecap="round">
    <path d="M180,210 q10,-12 20,0 q10,-12 20,0"/>
    <path d="M1010,180 q9,-11 18,0 q9,-11 18,0"/>
    <path d="M260,90 q8,-9 16,0 q8,-9 16,0"/>
  </g>

  <!-- rotating rays -->
  <g class="rays" stroke="#ffd166" stroke-width="2" opacity=".14">
    <line x1="600" y1="185" x2="600" y2="-160"/>
    <line x1="600" y1="185" x2="876" y2="47"/>
    <line x1="600" y1="185" x2="1010" y2="185"/>
    <line x1="600" y1="185" x2="876" y2="323"/>
    <line x1="600" y1="185" x2="600" y2="530"/>
    <line x1="600" y1="185" x2="324" y2="323"/>
    <line x1="600" y1="185" x2="190" y2="185"/>
    <line x1="600" y1="185" x2="324" y2="47"/>
    <line x1="600" y1="185" x2="757" y2="28"/>
    <line x1="600" y1="185" x2="443" y2="28"/>
    <line x1="600" y1="185" x2="443" y2="342"/>
    <line x1="600" y1="185" x2="757" y2="342"/>
  </g>

  <circle cx="600" cy="185" r="240" fill="url(#sunglow)"/>

  <!-- 8-ray Philippine sun -->
  <g transform="translate(600 185)">
    <g fill="url(#gold)">
      <path d="M-16,-52 L0,-150 L16,-52 Z"/>
      <path d="M-16,-52 L0,-150 L16,-52 Z" transform="rotate(45)"/>
      <path d="M-16,-52 L0,-150 L16,-52 Z" transform="rotate(90)"/>
      <path d="M-16,-52 L0,-150 L16,-52 Z" transform="rotate(135)"/>
      <path d="M-16,-52 L0,-150 L16,-52 Z" transform="rotate(180)"/>
      <path d="M-16,-52 L0,-150 L16,-52 Z" transform="rotate(225)"/>
      <path d="M-16,-52 L0,-150 L16,-52 Z" transform="rotate(270)"/>
      <path d="M-16,-52 L0,-150 L16,-52 Z" transform="rotate(315)"/>
      <circle r="46"/>
      <circle r="30" fill="#e2445c" opacity=".9"/>
    </g>
  </g>

  <!-- fiesta banderitas -->
  <g class="flags">
    <path d="M0,70 Q300,160 600,70 T1200,70" stroke="#ffd166" stroke-width="4" fill="none" opacity=".9"/>
    <g>
      <path d="M42,96 L78,96 L60,142 Z" fill="#0038a8"/>
      <path d="M132,119 L168,119 L150,165 Z" fill="#ce1126"/>
      <path d="M222,131 L258,131 L240,177 Z" fill="#fcd116"/>
      <path d="M312,138 L348,138 L330,184 Z" fill="#ffffff"/>
      <path d="M402,136 L438,136 L420,182 Z" fill="#0038a8"/>
      <path d="M492,127 L528,127 L510,173 Z" fill="#ce1126"/>
      <path d="M582,111 L618,111 L600,157 Z" fill="#fcd116"/>
      <path d="M672,116 L708,116 L690,162 Z" fill="#ffffff"/>
      <path d="M762,128 L798,128 L780,174 Z" fill="#0038a8"/>
      <path d="M852,136 L888,136 L870,182 Z" fill="#ce1126"/>
      <path d="M942,131 L978,131 L960,177 Z" fill="#fcd116"/>
      <path d="M1032,119 L1068,119 L1050,165 Z" fill="#ffffff"/>
      <path d="M1122,99 L1158,99 L1140,145 Z" fill="#0038a8"/>
    </g>
  </g>

  <!-- Manila skyline -->
  <g fill="#2a1650" opacity=".8">
    <rect x="30" y="330" width="52" height="120"/>
    <rect x="96" y="290" width="44" height="160"/>
    <rect x="152" y="350" width="60" height="100"/>
    <rect x="680" y="320" width="46" height="130"/>
    <rect x="740" y="280" width="40" height="170"/>
    <rect x="792" y="340" width="58" height="110"/>
    <rect x="862" y="300" width="44" height="150"/>
    <rect x="918" y="352" width="60" height="98"/>
    <rect x="990" y="316" width="46" height="134"/>
    <rect x="1048" y="356" width="66" height="94"/>
    <rect x="1126" y="326" width="44" height="124"/>
    <!-- church dome -->
    <rect x="470" y="360" width="120" height="90"/>
    <path d="M470,360 Q530,290 590,360 Z"/>
    <line x1="530" y1="290" x2="530" y2="268" stroke="#ffd166" stroke-width="4"/>
    <line x1="518" y1="280" x2="542" y2="280" stroke="#ffd166" stroke-width="4"/>
    <rect x="498" y="392" width="20" height="58" fill="#170b33"/>
    <rect x="542" y="392" width="20" height="58" fill="#170b33"/>
  </g>

  <!-- sari-sari store -->
  <g>
    <rect x="66" y="392" width="256" height="146" fill="#8a5a2b"/>
    <rect x="66" y="392" width="256" height="146" fill="#000" opacity=".12"/>
    <polygon points="46,392 342,392 322,346 66,346" fill="#b91c1c"/>
    <polygon points="66,346 322,346 318,356 70,356" fill="#7f1010"/>
    <!-- awning stripes -->
    <g>
      <rect x="70" y="356" width="32" height="22" fill="#ffffff"/>
      <rect x="102" y="356" width="32" height="22" fill="#b91c1c"/>
      <rect x="134" y="356" width="32" height="22" fill="#ffffff"/>
      <rect x="166" y="356" width="32" height="22" fill="#b91c1c"/>
      <rect x="198" y="356" width="32" height="22" fill="#ffffff"/>
      <rect x="230" y="356" width="32" height="22" fill="#b91c1c"/>
      <rect x="262" y="356" width="32" height="22" fill="#ffffff"/>
      <rect x="294" y="356" width="32" height="22" fill="#b91c1c"/>
    </g>
    <!-- hanging sachets -->
    <g stroke="#e5e7eb" stroke-width="1.5">
      <line x1="90" y1="378" x2="90" y2="398"/><line x1="120" y1="378" x2="120" y2="404"/>
      <line x1="150" y1="378" x2="150" y2="396"/><line x1="180" y1="378" x2="180" y2="404"/>
      <line x1="210" y1="378" x2="210" y2="398"/><line x1="240" y1="378" x2="240" y2="404"/>
    </g>
    <g>
      <rect x="84" y="398" width="12" height="8" fill="#ef4444"/><rect x="114" y="404" width="12" height="8" fill="#22c55e"/>
      <rect x="144" y="396" width="12" height="8" fill="#3b82f6"/><rect x="174" y="404" width="12" height="8" fill="#fcd116"/>
      <rect x="204" y="398" width="12" height="8" fill="#ffffff"/><rect x="234" y="404" width="12" height="8" fill="#a855f7"/>
    </g>
    <!-- open window with stocked shelves -->
    <rect x="98" y="440" width="192" height="70" fill="#2a1a0e"/>
    <g>
      <rect x="104" y="448" width="180" height="8" fill="#8a5a2b"/>
      <rect x="104" y="482" width="180" height="8" fill="#8a5a2b"/>
      <rect x="110" y="456" width="22" height="24" fill="#ef4444"/><rect x="138" y="456" width="22" height="24" fill="#22c55e"/>
      <rect x="166" y="456" width="22" height="24" fill="#fcd116"/><rect x="194" y="456" width="22" height="24" fill="#3b82f6"/>
      <rect x="222" y="456" width="22" height="24" fill="#ffffff"/><rect x="250" y="456" width="22" height="24" fill="#a855f7"/>
      <rect x="110" y="490" width="26" height="20" fill="#f97316"/><rect x="142" y="490" width="26" height="20" fill="#22c55e"/>
      <rect x="174" y="490" width="26" height="20" fill="#ef4444"/><rect x="206" y="490" width="26" height="20" fill="#fcd116"/>
      <rect x="238" y="490" width="26" height="20" fill="#3b82f6"/>
    </g>
    <!-- sign -->
    <rect x="88" y="398" width="0" height="0"/>
    <!-- softdrink crate -->
    <g>
      <rect x="300" y="498" width="70" height="40" rx="4" fill="#ce1126"/>
      <rect x="306" y="504" width="58" height="12" fill="#9a0c1c"/>
      <rect x="306" y="520" width="58" height="12" fill="#9a0c1c"/>
    </g>
  </g>

  <!-- PH flag on pole -->
  <g>
    <line x1="404" y1="330" x2="404" y2="538" stroke="#94a3b8" stroke-width="5"/>
    <g class="flagph">
      <rect x="406" y="340" width="96" height="26" fill="#0038a8"/>
      <rect x="406" y="366" width="96" height="26" fill="#ce1126"/>
      <polygon points="406,340 452,366 406,392" fill="#ffffff"/>
      <circle cx="424" cy="366" r="7" fill="#fcd116"/>
    </g>
  </g>

  <!-- jeepney -->
  <g>
    <rect x="704" y="344" width="392" height="38" rx="10" fill="#fcd116"/>
    <rect x="648" y="380" width="496" height="158" rx="14" fill="url(#jeepbody)"/>
    <!-- hood facing left -->
    <rect x="648" y="424" width="96" height="114" rx="9" fill="#8f0e18"/>
    <circle cx="660" cy="472" r="11" fill="#fff3b0"/>
    <!-- windows -->
    <g fill="#0b1222" stroke="#fcd116" stroke-width="3">
      <rect x="770" y="398" width="74" height="54" rx="6"/>
      <rect x="856" y="398" width="74" height="54" rx="6"/>
      <rect x="942" y="398" width="74" height="54" rx="6"/>
      <rect x="1028" y="398" width="74" height="54" rx="6"/>
    </g>
    <!-- festive stripes -->
    <rect x="744" y="474" width="400" height="14" fill="#fcd116"/>
    <rect x="744" y="496" width="400" height="7" fill="#ffffff" opacity=".9"/>
    <rect x="744" y="510" width="400" height="5" fill="#0038a8"/>
    <!-- side plate -->
    <rect x="850" y="522" width="150" height="26" rx="5" fill="#ffffff"/>
    <text x="925" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#b3121f">YEHAW</text>
    <!-- chrome bumper -->
    <rect x="640" y="530" width="120" height="12" rx="6" fill="#cbd5e1"/>
    <!-- wheels -->
    <g>
      <circle cx="756" cy="548" r="40" fill="#0b1222" stroke="#475569" stroke-width="7"/>
      <circle cx="756" cy="548" r="15" fill="#cbd5e1"/>
      <circle cx="1040" cy="548" r="40" fill="#0b1222" stroke="#475569" stroke-width="7"/>
      <circle cx="1040" cy="548" r="15" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- sea -->
  <rect x="0" y="552" width="1200" height="78" fill="url(#sea)" opacity=".95"/>
  <path d="M0,560 Q150,546 300,560 T600,560 T900,560 T1200,560" stroke="#67e8f9" stroke-width="3" fill="none" opacity=".35"/>
  <path d="M0,584 Q150,570 300,584 T600,584 T900,584 T1200,584" stroke="#67e8f9" stroke-width="2.5" fill="none" opacity=".22"/>
</svg>
